    - description: The Software Code of Practice has been created by DSIT and the
        National Cyber Security Centre (NCSC), the UK’s technical authority for
        cyber security, and is co-sealed by the Canadian Centre for Cyber
        Security (CCCS). The Code reflects the government’s ongoing focus on
        codifying minimum standards for technology providers to reduce cyber
        risk. It is aimed at professionals who are responsible for overseeing
        the development of ‘commodity’ software, including technical,
        compliance, and risk experts. For those organisations that require a
        higher level of assurance in the resilience of their connected products
        and technology, consider using the NCSC’s Cyber Resilience Testing
