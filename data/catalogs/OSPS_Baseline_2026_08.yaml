    - description: This publication provides guidance to organizations on identifying,
        assessing, and mitigating cybersecurity risks throughout the supply
        chain at all levels of their organizations. The publication integrates
        cybersecurity supply chain risk management (C-SCRM) into risk management
        activities by applying a multilevel, C-SCRM-specific approach, including
        guidance on the development of C-SCRM strategy implementation plans,
        C-SCRM policies, C-SCRM plans, and risk assessments for products and
        services.
      id: 800-161
      title: NIST Special Publication 800-161 - Cybersecurity Supply Chain Risk
