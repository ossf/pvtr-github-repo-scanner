    - description: "PCI Security Standards are technical and operational requirements
        set by the PCI Security Standards Council (PCI SSC) to protect
        cardholder data. The standards apply to all entities that store, process
        or transmit cardholder data – with requirements for software developers
        and manufacturers of applications and devices used in those
        transactions. The Council is responsible for managing the security
        standards, while compliance with the PCI set of standards is enforced by
        the founding members of the Council: American Express, Discover
        Financial Services, JCB, MasterCard and Visa Inc. The PCI Data Security
        Standard (PCI DSS) applies to all entities that store, process, and/or
        transmit cardholder data. It covers technical and operational system
        components included in or connected to cardholder data. If you accept or
        process payment cards, PCI DSS applies to you."
      id: PCIDSS
      title: Payment Card Industry Data Security Standard
      url: https://docs-prv.pcisecuritystandards.org/PCI%20DSS/Standard/PCI-DSS-v4_0_1.pdf
